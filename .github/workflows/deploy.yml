name: Deploy Simulat3D WordPress
on:
  push:
    branches: [main]
    paths:
      - 'wordpress/themes/**'
      - 'wordpress/plugins/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: production-wordpress
  cancel-in-progress: false
jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          coverage: none
      - name: Validate PHP and theme metadata
        run: |
          find wordpress/themes wordpress/plugins -name '*.php' -print0 | xargs -0 -n1 php -l
          python3 -m json.tool wordpress/themes/simulat3d/theme.json > /dev/null
      - name: Install SFTP password helper
        run: sudo apt-get update -qq && sudo apt-get install -y sshpass
      - name: Deploy only the custom theme and contact plugin
        env:
          SSHPASS: ${{ secrets.FTP_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$SSHPASS"
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' 'ftp.cluster130.hosting.ovh.net ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIK+v6Lr/30gISPJk8ViZ/esm/PYi97Bqxhr5Fn9Yt1kI' > ~/.ssh/known_hosts
          cat > "$RUNNER_TEMP/wordpress.sftp" <<'SFTP'
          cd /home/simulat/www/wordpress/wp-content/themes
          put -R wordpress/themes/simulat3d
          cd /home/simulat/www/wordpress/wp-content/plugins
          put -R wordpress/plugins/simulat3d-contact
          SFTP
          sshpass -e sftp -oBatchMode=no -oStrictHostKeyChecking=yes -b "$RUNNER_TEMP/wordpress.sftp" simulat@ftp.cluster130.hosting.ovh.net
      - name: Verify public pages
        run: |
          curl --fail --silent --show-error https://simulat3d.eu/ -o "$RUNNER_TEMP/home.html"
          grep -q '/wordpress/wp-content/themes/simulat3d/' "$RUNNER_TEMP/home.html"
          curl --fail --silent --show-error https://simulat3d.eu/prywatnosc/ > /dev/null
